<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>めざせ天下第一関</title>
<meta name="description" content="公立中高一貫校（下関西高校附属中など）の受検勉強を、シューティングとパズルで楽しく学べる小学6年生向けアプリ">
<meta name="theme-color" content="#12273b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="天下第一関">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Maru+Gothic:wght@400;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
html,body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
/* layout: 港のアプリ — 上に固定の海峡バー、中央に1カラムの「ドック」(カード群)、下に固定のタブ */
:root {
  --bg: #edf3f7;
  --surface: #ffffff;
  --surface-2: #f5f9fb;
  --ink: #12273b;
  --muted: #586d81;
  --line: #d3e0e9;
  --accent: #ee9416;
  --accent-ink: #3b2200;
  --accent-soft: #fdebcf;
  --sea: #1d6d8a;
  --sea-soft: #d8edf4;
  --good: #19935b;
  --good-soft: #d9f2e5;
  --bad: #cf3f3f;
  --bad-soft: #fbe1e1;
  --shadow: 0 1px 2px rgba(18, 39, 59, .06), 0 6px 18px rgba(18, 39, 59, .06);

  --s-kokugo: #d2524a;
  --s-sansu: #2f6fd0;
  --s-rika: #2a9a5a;
  --s-shakai: #b8742a;
  --s-eigo: #7b52c9;
  --s-tekisei: #138a8a;
  --s-ongaku: #cc4f93;
  --s-zuko: #c39a12;
  --s-katei: #e0703f;
  --s-hoken: #5f9a1e;

  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-game: "DotGothic16", "Osaka-Mono", "MS Gothic", monospace;

  --hero-veil: linear-gradient(100deg, rgba(244,249,252,.94) 0%, rgba(244,249,252,.72) 40%, rgba(244,249,252,.08) 78%);
  --hero-art: var(--art-day, none);
  --r: 14px;
  --r-sm: 9px;
  --tab-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1827;
    --surface: #12253a;
    --surface-2: #0f2032;
    --ink: #e6eef6;
    --muted: #93a8bc;
    --line: #23405a;
    --accent: #ffb03f;
    --accent-ink: #2a1600;
    --accent-soft: #3a2a12;
    --sea: #58b8d6;
    --sea-soft: #15364a;
    --good: #3ccf8e;
    --good-soft: #123a2a;
    --bad: #ff6f6f;
    --bad-soft: #3f1c20;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .25);
    --s-kokugo: #ff7a70; --s-sansu: #6ea4ff; --s-rika: #4fd08a; --s-shakai: #e3a35c; --s-eigo: #ad8bff;
    --s-tekisei: #3cc7c7; --s-ongaku: #ff7fc0; --s-zuko: #f0c93c; --s-katei: #ff9a6b; --s-hoken: #9bd34f;
    --hero-veil: linear-gradient(100deg, rgba(7,18,33,.92) 0%, rgba(7,18,33,.62) 42%, rgba(7,18,33,.1) 80%);
    --hero-art: var(--art-night, none);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1827;
  --surface: #12253a;
  --surface-2: #0f2032;
  --ink: #e6eef6;
  --muted: #93a8bc;
  --line: #23405a;
  --accent: #ffb03f;
  --accent-ink: #2a1600;
  --accent-soft: #3a2a12;
  --sea: #58b8d6;
  --sea-soft: #15364a;
  --good: #3ccf8e;
  --good-soft: #123a2a;
  --bad: #ff6f6f;
  --bad-soft: #3f1c20;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .25);
  --s-kokugo: #ff7a70; --s-sansu: #6ea4ff; --s-rika: #4fd08a; --s-shakai: #e3a35c; --s-eigo: #ad8bff;
  --s-tekisei: #3cc7c7; --s-ongaku: #ff7fc0; --s-zuko: #f0c93c; --s-katei: #ff9a6b; --s-hoken: #9bd34f;
  --hero-veil: linear-gradient(100deg, rgba(7,18,33,.92) 0%, rgba(7,18,33,.62) 42%, rgba(7,18,33,.1) 80%);
  --hero-art: var(--art-night, none);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.7;
  padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 12px);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface);
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; margin: 0; }
p { margin: 0; }

.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 8px; min-height: 56px; }
.logo { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; background: none; border: 0; padding: 0; text-align: left; }
.logo svg, .logo img { width: 36px; height: auto; flex: none; }
.logo b { font-family: var(--f-display); font-weight: 400; font-size: 17px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pts {
  display: flex; align-items: center; gap: 6px; font-family: var(--f-game); font-size: 15px;
  background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 3px 12px 3px 4px; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.pts i { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-style: normal; color: var(--accent-ink); font-size: 12px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2);
  display: grid; place-items: center; flex: none;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn[aria-pressed="false"] { opacity: .55; }
.icon-btn[aria-pressed="false"] .on { display: none; }
.icon-btn[aria-pressed="true"] .off { display: none; }

/* ---------- tab bar ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs .row { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tab-h); }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); font-weight: 700; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--sea); }
.tab[aria-current="page"] svg { stroke: var(--sea); }

main { padding-block: 16px 24px; }
body.playing { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
body.playing .tabs { display: none; }
.view { display: grid; gap: 16px; }
.view > * { min-width: 0; }

/* ---------- common ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-h h2 { font-family: var(--f-display); font-weight: 400; font-size: 20px; letter-spacing: .02em; }
.sec-h small { color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.btn {
  border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; background: var(--sea); color: #fff;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; text-align: center; line-height: 1.3;
  transition: transform .08s ease, filter .15s;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(1px) scale(.99); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.accent { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.btn.good { background: var(--good); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.row-btns > .btn { flex: 1 1 140px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.warn { background: var(--accent-soft); color: var(--ink); border-color: transparent; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 999px; background: var(--sea); transition: width .5s ease; }

/* ---------- hero ---------- */
.hero {
  display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center;
  grid-template-areas: "guide bubble" "stats stats";
  background: var(--hero-veil), var(--hero-art) right 30% / cover no-repeat, var(--sea-soft);
  border: 1px solid var(--line); border-radius: 20px; padding: 20px 16px 16px; position: relative; overflow: hidden;
  min-height: 250px;
}
.hero .mascot { width: 128px; height: auto; filter: drop-shadow(0 6px 10px rgba(10, 30, 50, .22)); animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
.hero .bubble { max-width: 520px; grid-area: bubble; }
.hero .hero-stats { grid-area: stats; }
.guide-hero { grid-area: guide; height: 190px; width: auto; max-width: none; align-self: end; filter: drop-shadow(0 6px 10px rgba(10, 30, 50, .22)); }
@media (min-width: 640px) {
  .hero { grid-template-areas: "guide bubble" "guide stats"; padding-bottom: 0; }
  .guide-hero { height: 250px; margin-top: -8px; }
  .hero .hero-stats { margin-bottom: 16px; }
}
.guide-face { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: var(--accent-soft); border: 2px solid var(--accent); flex: none; }
.guide-say { display: grid; grid-template-columns: 46px 1fr; gap: 10px; align-items: start; }
.guide-say > div { min-width: 0; }
.result-guide { height: 170px; width: auto; max-width: none; display: inline-block; filter: drop-shadow(0 6px 10px rgba(10, 30, 50, .25)); animation: pop .5s ease both; }
.fb-guide { height: 96px; width: auto; }
.banner-guide { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,.8); }
.inst-guide { height: 110px; width: auto; max-width: none; }
.intro-guide { height: 210px; width: auto; max-width: none; }
.intro { display: grid; gap: 10px; }
.intro-list { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.hero .stat { background: color-mix(in srgb, var(--surface) 86%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.bubble { position: relative; background: var(--surface); border: 2px solid var(--ink); border-radius: 16px; padding: 10px 14px; font-weight: 700; min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -11px; top: 50%; width: 16px; height: 16px; background: var(--surface); border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: translateY(-50%) rotate(45deg); }
.hero-stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.stat .v { font-family: var(--f-game); font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v small { font-size: 13px; color: var(--muted); }
.goalbar { margin-top: 6px; }

/* ---------- game docks ---------- */
.docks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.dock {
  display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; box-shadow: var(--shadow);
  transition: transform .12s ease, border-color .12s;
}
.dock:hover { transform: translateY(-2px); border-color: var(--sea); }
.dock .ic { width: 64px; height: 64px; border-radius: 14px; display: grid; place-items: center; background: #0e2a44; overflow: hidden; }
.dock .ic svg { width: 46px; height: 46px; }
.dock .ic img { width: 100%; height: 100%; object-fit: contain; display: block; }
.dock .ic:has(img) { background: none; }
.dock .ic.fuku { background: var(--accent-soft); }
.dock .ic.fuku img { width: 88%; height: 88%; }
.dock[disabled] { opacity: .6; cursor: default; }
.dock[disabled]:hover { transform: none; border-color: var(--line); }
.dock h3 { font-size: 17px; font-weight: 700; }
.dock p { font-size: 13px; color: var(--muted); line-height: 1.5; }
.dock.feature {
  grid-column: 1 / -1; grid-template-columns: 92px 1fr; border: 2px solid var(--accent); min-height: 128px; color: #f3f7fb;
  background: linear-gradient(90deg, rgba(5,17,34,.94) 0%, rgba(5,17,34,.72) 50%, rgba(5,17,34,.2) 100%), var(--art-night, none) center 28% / cover no-repeat, #0b2340;
}
.dock.feature p { color: rgba(243, 247, 251, .82); }
.dock.feature:hover { border-color: var(--accent); }
.dock.feature .ic { width: 92px; height: 92px; }
.dock.feature .ic svg { width: 62px; height: 62px; }
.dock.feature h3 { font-family: var(--f-display); font-weight: 400; font-size: 21px; }

/* ---------- subject chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 14px; font-weight: 700; min-height: 44px;
}
.chip[aria-pressed="true"] { border-color: var(--sea); background: var(--sea-soft); box-shadow: inset 0 0 0 1px var(--sea); }
.chip .cnt { font-family: var(--f-game); font-size: 12px; color: var(--muted); }

/* ---------- subject mastery ---------- */
.mastery { display: grid; gap: 10px; }
.m-row { display: grid; grid-template-columns: 92px 1fr 88px; gap: 10px; align-items: center; }
.m-row .nm { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.m-row .num { text-align: right; font-family: var(--f-game); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.25; }
.m-row .num small { display: block; font-size: 11px; }
.m-row .num.good { color: var(--good); font-weight: 700; }
.m-row .num.bad { color: var(--bad); font-weight: 700; }

/* ---------- quiz ---------- */
.q-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.q-box { background: var(--surface); border: 2px solid var(--ink); border-radius: 16px; padding: 16px; position: relative; }
.q-box .q { font-size: 20px; font-weight: 700; line-height: 1.6; }
.q-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.opt {
  border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; font-weight: 700; font-size: 17px;
  text-align: left; min-height: 60px; display: flex; gap: 10px; align-items: center;
}
.opt:hover:not(:disabled) { border-color: var(--sea); }
.opt .k { width: 30px; height: 30px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--f-game); flex: none; }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.ng { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.explain { border-left: 4px solid var(--sea); background: var(--sea-soft); border-radius: 0 12px 12px 0; padding: 10px 14px; }
.timer { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.timer > span { display: block; height: 100%; background: var(--accent); width: 100%; transform-origin: left; }
.speak { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; }
.speak svg { width: 18px; height: 18px; }

/* ---------- shooter ---------- */
.shooter { display: grid; gap: 10px; }
.sh-q { background: #0e2236; color: #f3f7fb; border-radius: 16px; padding: 12px 14px; border: 2px solid #2b4f70; display: grid; gap: 6px; }
.sh-q .q { font-size: 18px; font-weight: 700; line-height: 1.55; }
.sh-q .speak { background: #173452; border-color: #2b4f70; color: #f3f7fb; }
.sh-hud { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--f-game); font-size: 14px; color: #ffd27a; flex-wrap: wrap; }
.canvas-box { position: relative; border-radius: 16px; overflow: hidden; border: 2px solid #2b4f70; background: #071423; touch-action: none; user-select: none; -webkit-user-select: none; }
.canvas-box canvas { display: block; width: 100%; }
.sh-help { font-size: 13px; color: var(--muted); text-align: center; }

/* ---------- order puzzle ---------- */
.slots { display: grid; gap: 8px; }
.slot { display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 10px; min-height: 52px; border: 2px dashed var(--line); border-radius: 12px; padding: 6px 10px; background: var(--surface-2); text-align: left; }
.slot .n { width: 30px; height: 30px; border-radius: 50%; background: var(--sea); color: #fff; display: grid; place-items: center; font-family: var(--f-game); }
.slot.filled { border-style: solid; background: var(--surface); }
.slot.ok { border-color: var(--good); background: var(--good-soft); }
.slot.ng { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { border: 2px solid var(--ink); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 700; min-height: 48px; box-shadow: 0 3px 0 var(--ink); }
.tile:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* ---------- pair puzzle ---------- */
.pairs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 720px; margin: 0 auto; }
@media (max-width: 520px) { .pairs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.pcard { aspect-ratio: 4 / 3; max-width: 100%; border: 0; padding: 0; background: none; position: relative; border-radius: 12px; }
.pcard .in { position: absolute; inset: 0; }
.pcard .f, .pcard .b { position: absolute; inset: 0; border-radius: 12px; display: grid; place-items: center; padding: 6px; text-align: center; font-weight: 700; line-height: 1.3; }
.pcard .f { background: #0e2a44 var(--art-fuku, none) center / auto 62% no-repeat; border: 2px solid #2b4f70; }
.pcard .f svg { width: 46%; height: 46%; max-height: 64px; }
.pcard .b { display: none; background: var(--surface); border: 2px solid var(--ink); font-size: clamp(12px, 3.3vw, 16px); overflow-wrap: anywhere; }
.pcard.open .b, .pcard.done .b { display: grid; animation: flipin .22s ease; }
.pcard.open .f, .pcard.done .f { display: none; }
.pcard.done .b { background: var(--good-soft); border-color: var(--good); }
@keyframes flipin { from { transform: scaleX(.2); opacity: .3; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .hero .mascot, .result-fuku, .result-guide { animation: none; } .pcard.open .b, .pcard.done .b { animation: none; } .slot.ng { animation: none; } .dock { transition: none; } }

/* ---------- tekisei ---------- */
.data-table { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.data-table caption { text-align: left; font-weight: 700; padding-bottom: 6px; font-size: 14px; color: var(--muted); }
.data-table th, .data-table td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
.data-table th { background: var(--surface-2); }
.scroll-x { overflow-x: auto; }
.chart-svg { width: 100%; height: auto; max-width: 560px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- writing ---------- */
.genko {
  width: 100%; min-height: 240px; resize: vertical; border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px;
  background-color: var(--surface);
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 35px, var(--line) 35px, var(--line) 36px);
  background-attachment: local; line-height: 36px; font-size: 17px;
}
.genko:focus { border-color: var(--sea); outline: none; }
.counter { font-family: var(--f-game); font-variant-numeric: tabular-nums; }
.counter.ok { color: var(--good); }
.counter.ng { color: var(--bad); }
.fb { display: grid; gap: 10px; }
.fb .score { font-family: var(--f-game); font-size: 40px; line-height: 1; color: var(--sea); }
.fb ul { margin: 0; padding-left: 1.2em; }
.ring { width: 140px; height: 140px; margin: 0 auto; display: block; }

/* ---------- record ---------- */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 140px), 1fr)); gap: 10px; }
.badge { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 4px; justify-items: center; text-align: center; background: var(--surface-2); }
.badge svg { width: 44px; height: 44px; }
.badge b { font-size: 13px; }
.badge small { font-size: 11px; color: var(--muted); line-height: 1.4; }
.badge.off { opacity: .4; filter: grayscale(1); }
.rankbox { display: grid; gap: 8px; }
.rankbox .nm { font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.ladder { display: flex; flex-wrap: wrap; gap: 6px; }
.ladder span { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
.ladder span.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }

/* ---------- forms ---------- */
.field { display: grid; gap: 4px; }
.field label { font-weight: 700; font-size: 14px; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; }
.field textarea { min-height: 120px; resize: vertical; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.switch:last-child { border-bottom: 0; }
.switch input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--sea); }
.switch input[type=range] { accent-color: var(--sea); width: 140px; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.list { display: grid; gap: 8px; }
.li { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface-2); display: grid; gap: 4px; }

/* ---------- overlays ---------- */
.banner {
  position: fixed; left: 0; right: 0; top: 0; z-index: 40;
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.banner .in { pointer-events: auto; max-width: 620px; margin: 0 auto; background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; }
.banner .mascot { width: 52px; height: auto; }
.banner .row-btns { grid-column: 1 / -1; }
.banner .btn.ghost { background: rgba(255,255,255,.55); border-color: transparent; color: var(--accent-ink); }
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-50%); z-index: 45;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; max-width: min(92vw, 520px); text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
}
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(6, 16, 28, .6); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal .card { width: min(560px, 100%); max-height: 88vh; overflow: auto; display: grid; gap: 12px; }
.mode-ic { width: 56px; height: 56px; flex: none; display: grid; place-items: center; border-radius: 12px; background: #0e2a44; overflow: hidden; }
.mode-ic img, .mode-ic svg { width: 100%; height: 100%; object-fit: contain; }
.mode-ic:has(img) { background: none; }
.result-fuku { width: 132px; height: auto; display: inline-block; filter: drop-shadow(0 6px 10px rgba(10, 30, 50, .25)); animation: pop .5s ease both; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: none; } }
.fb-fuku { width: 72px; height: auto; }
.install-card { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 16px; padding: 12px 14px; }
.inst-fuku { width: 72px; height: auto; }
.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 10px; font-size: 16px; }
.steps li::marker { font-family: var(--f-game); color: var(--sea); font-weight: 700; }
.result-big { font-family: var(--f-game); font-size: 44px; line-height: 1; color: var(--accent); text-align: center; }
.missed { display: grid; gap: 8px; }
.missed .li b { color: var(--good); }
.stack { display: grid; gap: 12px; }
.center { text-align: center; }
.flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.linkish { background: none; border: 0; padding: 0; color: var(--sea); font-weight: 700; text-decoration: underline; }
.empty { border: 2px dashed var(--line); border-radius: 14px; padding: 20px; text-align: center; color: var(--muted); }

@media (max-width: 420px) {
  .logo b { font-size: 15px; }
  .hero .mascot { width: 92px; }
  .guide-hero { height: 170px; }
  .hero { min-height: 0; }
  .dock.feature { grid-template-columns: 76px 1fr; }
  .dock.feature .ic { width: 76px; height: 76px; }
  .q-box .q { font-size: 18px; }
  .m-row { grid-template-columns: 80px 1fr 70px; }
  .stat .v { font-size: 18px; }
  .stat { padding: 8px; }
}

</style>

/* ================= みなとの声：文の分け方と録音の見つけ方 =================
   画面（DOM）を使わない関数だけを置く。声を書き出すスクリプト（tools/voice_lines.js）も同じ関数を使うので、

const TTS_UNIT = { km: 'キロメートル', cm: 'センチメートル', mL: 'ミリリットル', kg: 'キログラム', m: 'メートル', g: 'グラム' };
function ttsClean(t) {
  return String(t)
    .replace(/（聞きとり）/g, '')
    .replace(/(\d+)\/(\d+)/g, '$2ぶんの$1')
    .replace(/×/g, 'かける').replace(/÷/g, 'わる').replace(/□/g, 'しかく').replace(/＝/g, 'イコール')
    .replace(/(\d+|しかく)：(\d+|しかく)/g, '$1たい$2').replace(/(\d)〜(\d)/g, '$1から$2')
    .replace(/何(km|cm|mL|kg|m|g)(?![a-zA-Z²³])/g, (s, u) => '何' + TTS_UNIT[u])
    .replace(/cm²/g, '平方センチメートル').replace(/km²/g, '平方キロメートル').replace(/m²/g, '平方メートル').replace(/cm³/g, '立方センチメートル')
    .replace(/(\d)km/g, '$1キロメートル').replace(/(\d)cm/g, '$1センチメートル').replace(/(\d)mL/g, '$1ミリリットル')
    .replace(/(\d)kg/g, '$1キログラム').replace(/(\d)m(?![a-zA-Z])/g, '$1メートル').replace(/(\d)g(?![a-zA-Z])/g, '$1グラム')
    .replace(/%/g, 'パーセント').replace(/°/g, '度').replace(/（　）/g, 'かっこ');
}
/* 文字列 → 8けたの番号（録音ファイルの名前） */
function vhash(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return ('0000000' + h.toString(16)).slice(-8);
}
/* 日本語はみなとの声、英語は英語の声で読むように文を分ける → [{t, en?}] */
function voiceSegs(text, lang) {
  if (text == null || text === '') return [];
  if (lang === 'en') return [{ t: String(text), en: 1 }];
  const s = ttsClean(text), out = [];
  const re = /[A-Za-z][A-Za-z'’-]*(?:[ ,.!?]+[A-Za-z][A-Za-z'’-]*)*[.!?]?/g;
  let buf = '', last = 0, m;
  const flush = () => { const t = buf.trim(); buf = ''; if (t && /[^\s\p{P}\p{S}]/u.test(t)) out.push({ t }); };
  while ((m = re.exec(s))) {
    if (!/[a-z]{2,}/.test(m[0])) continue; // A・x・BTB・P.E. のような1文字や略語は日本語の声で読む
    buf += s.slice(last, m.index); flush();
    out.push({ t: m[0].trim(), en: 1 });
    last = m.index + m[0].length;
  }
  buf += s.slice(last); flush();
  return out;
}

    ctx.fillStyle = '#ee9416'; ctx.beginPath(); ctx.moveTo(-28, -4); ctx.lineTo(28, -4); ctx.lineTo(19, 11); ctx.lineTo(-19, 11); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 6);
    const art = seaImage();
    if (art) {
      const sc = Math.max(W / art.naturalWidth, (H * 0.82) / art.naturalHeight);
      const iw = art.naturalWidth * sc, ih = art.naturalHeight * sc, ix = (W - iw) / 2;
      if (ih < H) {
        if (!seaGrad) { seaGrad = ctx.createLinearGradient(0, ih - 60, 0, H); seaGrad.addColorStop(0, 'rgba(3,22,48,0)'); seaGrad.addColorStop(0.35, 'rgb(3,22,48)'); seaGrad.addColorStop(1, 'rgb(2,13,30)'); }
        ctx.fillStyle = 'rgb(3,22,48)'; ctx.fillRect(-10, ih - 2, W + 20, H - ih + 12);
      }
      ctx.drawImage(art, ix, 0, iw, ih);
      if (ih < H) { ctx.fillStyle = seaGrad; ctx.fillRect(-10, ih - 60, W + 20, H - ih + 70); }
      if (!veilGrad) { veilGrad = ctx.createLinearGradient(0, H * 0.45, 0, H); veilGrad.addColorStop(0, 'rgba(2,10,24,0)'); veilGrad.addColorStop(1, 'rgba(2,10,24,.45)'); }
      ctx.fillStyle = veilGrad; ctx.fillRect(0, H * 0.45, W, H * 0.55);
      for (let i = 0; i < 4; i++) {
        const yy = Math.max(ih * 0.5, H * 0.5) + i * (H * 0.09);
        ctx.strokeStyle = 'rgba(160,220,240,0.07)'; ctx.lineWidth = 2; ctx.beginPath();
        for (let x = 0; x <= W; x += 14) { const y = yy + Math.sin(x * 0.03 + g.time * (0.8 + i * 0.15) + i) * 3; if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
        ctx.stroke();
      }
    } else {
    if (!skyGrad) {
      skyGrad = ctx.createLinearGradient(0, 0, 0, H);
      skyGrad.addColorStop(0, '#05132a'); skyGrad.addColorStop(0.4, '#123a5e'); skyGrad.addColorStop(0.405, '#0b3956'); skyGrad.addColorStop(1, '#03182b');
    }
    ctx.fillStyle = skyGrad; ctx.fillRect(-10, -10, W + 20, H + 20);
    sky.forEach(s => { ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(g.time * 0.8 + s.t)); ctx.fillStyle = '#fff'; ctx.fillRect(s.x * W, s.y * H, s.r, s.r); });
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff1c2'; ctx.beginPath(); ctx.arc(W * 0.88, H * 0.08, 12, 0, 7); ctx.fill();
    ctx.fillStyle = '#0a2238';
    ctx.beginPath(); ctx.moveTo(0, H * 0.405);
    for (let x = 0; x <= W * 0.3; x += 8) ctx.lineTo(x, H * 0.36 - Math.sin(x / (W * 0.3) * Math.PI) * H * 0.06);
    ctx.lineTo(W * 0.3, H * 0.405); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W * 0.7, H * 0.405);
    for (let x = W * 0.7; x <= W; x += 8) ctx.lineTo(x, H * 0.37 - Math.sin((x - W * 0.7) / (W * 0.3) * Math.PI) * H * 0.05);
    ctx.lineTo(W, H * 0.405); ctx.closePath(); ctx.fill();
    drawBridge();
    for (let i = 0; i < 7; i++) {
      const yy = H * 0.45 + i * (H * 0.075);
      ctx.strokeStyle = `rgba(95,198,228,${0.1 + i * 0.025})`; ctx.lineWidth = 2; ctx.beginPath();
      for (let x = 0; x <= W; x += 12) { const y = yy + Math.sin(x * 0.03 + g.time * (0.8 + i * 0.15) + i) * 3; if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
      ctx.stroke();
    }
    }
    const dy = DANGER();
    ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(255,120,120,.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, dy); ctx.lineTo(W, dy); ctx.stroke(); ctx.setLineDash([]);
    targets.forEach(t => { if (t.alive) drawTarget(t); });
    if (star) drawStar(star);
    ctx.fillStyle = '#ffe28a';
    bullets.forEach(b => { ctx.beginPath(); ctx.ellipse(b.x, b.y, 3, 8, 0, 0, 7); ctx.fill(); });
    drawBoat();
    parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    pops.forEach(p => { ctx.globalAlpha = Math.min(1, p.life * 1.5); ctx.font = '20px "DotGothic16", monospace'; ctx.lineWidth = 4; ctx.strokeStyle = '#05132a'; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.c; ctx.fillText(p.text, p.x, p.y); });
    ctx.globalAlpha = 1;
    if (g.phase === 'intro') { ctx.font = '30px "DotGothic16", monospace'; ctx.fillStyle = '#ffd36b'; ctx.fillText('READY?', W / 2, H * 0.55); }
    if (paused) { ctx.fillStyle = 'rgba(3,12,24,.65)'; ctx.fillRect(0, 0, W, H); ctx.font = '26px "DotGothic16", monospace'; ctx.fillStyle = '#fff'; ctx.fillText('一時停止中', W / 2, H / 2 - 10); ctx.font = '15px "DotGothic16", monospace'; ctx.fillText('タップで再開', W / 2, H / 2 + 22); }
    ctx.restore();
  }
  function frame(now) {
    if (!alive) return;
    const dt = last ? Math.min(0.033, (now - last) / 1000) : 0.016; last = now;
    if (!paused) { g.time += dt; update(dt); }
    draw();
    raf = requestAnimationFrame(frame);
  }
  function setPause(v) { paused = v; const b = $('#shPause'); if (b) b.textContent = v ? '再開' : '一時停止'; if (v) Voice.stop(); }
  const posX = e => { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) * (W / r.width); };
  const onDown = e => {
    e.preventDefault(); Snd.unlock();
    if (paused) { setPause(false); return; }
    P.tx = clamp(posX(e), 22, W - 22); P.fireQ = true; P.fireAt = performance.now(); dragging = true;
    try { cv.setPointerCapture(e.pointerId); } catch (_) { /* */ }
  };
  const onMove = e => { if (paused) return; if (dragging || e.pointerType === 'mouse') P.tx = clamp(posX(e), 22, W - 22); };
  const onUp = () => { dragging = false; };
  const onKey = e => {
    if (e.target && e.target.closest && e.target.closest('input,textarea,select')) return;
    if ($('#modal')) return;
    const down = e.type === 'keydown';
    if (e.key === 'ArrowLeft' || e.key === 'a') { keys.l = down; e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd') { keys.r = down; e.preventDefault(); }
    else if ((e.key === ' ' || e.key === 'ArrowUp') && down) { e.preventDefault(); if (!paused) fire(); }
    else if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && down) setPause(!paused);
  };
  const onVis = () => { if (document.hidden) setPause(true); };
  const onResize = () => resize();
  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', onUp);
  window.addEventListener('keydown', onKey);
  window.addEventListener('keyup', onKey);
  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('resize', onResize);
  $('#shPause', root).addEventListener('click', () => setPause(!paused));
  $('#shSpeak', root).addEventListener('click', () => { if (g.phase === 'play' || g.phase === 'reveal') speakQ(qs[g.qi], true); });
  resize(); hud();
  raf = requestAnimationFrame(frame);
  return {
    destroy() {
      if (g.phase !== 'end') { addMinutes(Date.now() - g.startAt); commit(); }
      alive = false; cancelAnimationFrame(raf);
      window.removeEventListener('keydown', onKey); window.removeEventListener('keyup', onKey);
      document.removeEventListener('visibilitychange', onVis); window.removeEventListener('resize', onResize);
    },
  };
}

/* ================= スピードクイズ・ふくしゅう ================= */
function startQuiz(main, subject, review) {
  const qs = review ? shuffle(Object.keys(S.wrong).map(findQ).filter(Boolean)).slice(0, 10) : pickQs(subject, 10);
  if (!qs.length) { main.innerHTML = '<div class="view"><div class="empty">問題がありません。<br><button class="btn ghost small" data-act="nav" data-view="home">ホームへ</button></div></div>'; return; }
  bgm(review ? 'puzzle' : 'battle');
  const g = { i: 0, score: 0, correct: 0, missed: [], start: Date.now(), qStart: 0, answered: false, opts: [] };
  let alive = true;
  function show() {
    const q = qs[g.i];
    g.answered = false; g.qStart = performance.now(); g.opts = shuffle([q.a, ...q.d]);
    main.innerHTML = `<div class="view">
    <div class="q-head"><button class="btn ghost small" data-act="quit">やめる</button><span class="pill">${review ? 'ふくしゅう ' : ''}${g.i + 1} / ${qs.length}</span><span class="spacer"></span><span class="pill warn">${g.score} pt</span></div>
    <div class="timer" aria-hidden="true"><span id="qzTimer"></span></div>
    <div class="q-box"><div class="q-meta">${subjPill(q.s)}${q.lv === 3 ? '<span class="pill warn">少し上</span>' : ''}${q.custom ? '<span class="pill">追加した問題</span>' : ''}</div><div class="q">${esc(qText(q))}</div><div style="margin-top:8px"><button class="speak" id="qzSpeak">${ICON.speak}読み上げ</button></div></div>
    <div class="opts">${g.opts.map((o, k) => `<button class="opt" data-i="${k}"><span class="k">${k + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="qzAfter" aria-live="polite"></div>
  </div>`;
    $$('.opt', main).forEach(b => b.addEventListener('click', () => answer(b)));
    $('#qzSpeak', main).addEventListener('click', () => speakQ(q, true));
    const bar = $('#qzTimer', main);
    bar.style.transform = 'scaleX(1)';
    requestAnimationFrame(() => requestAnimationFrame(() => { if (!bar.isConnected) return; bar.style.transition = 'transform 15s linear'; bar.style.transform = 'scaleX(0)'; }));
    speakQ(q);
  }
  function answer(btn) {
    if (g.answered) return; g.answered = true;
    const q = qs[g.i], val = g.opts[+btn.dataset.i], ok = val === q.a;
    const sec = (performance.now() - g.qStart) / 1000;
    const bar = $('#qzTimer', main); if (bar) { const cs = getComputedStyle(bar).transform; bar.style.transition = 'none'; bar.style.transform = cs; }
    $$('.opt', main).forEach(b => { b.disabled = true; if (g.opts[+b.dataset.i] === q.a) b.classList.add('ok'); });
    if (!ok) btn.classList.add('ng');
    recordAnswer(q, ok, review);
    if (ok) {
      g.correct++;
      const pts = [0, 10, 15, 20][q.lv || 1] + (sec < 8 ? 5 : 0) + (review ? 5 : 0);
      g.score += pts; addXP(pts);
      Snd.sfx('ok'); Voice.say(pickOne(PRAISE));
    } else {
      g.missed.push(q); Snd.sfx('ng'); Voice.say([pickOne(ENCOURAGE), VL.ans(q.a)]);
    }
    checkBadges();
    commit();
    $('#qzAfter', main).innerHTML = `<div class="explain stack"><div class="guide-say">${minatoFace(ok ? 'yatta' : 'guide')}<div><b>${ok ? 'せいかい！' : 'こたえ：' + esc(q.a)}</b>${ok && sec < 8 ? ' <span class="pill warn">スピードボーナス</span>' : ''}<br>${esc(q.e || '')}${q.say ? '<br><span class="small muted">英語：' + esc(q.say) + '</span>' : ''}</div></div><button class="btn accent" id="qzNext">${g.i < qs.length - 1 ? 'つぎの問題へ' : '結果を見る'}</button></div>`;
    const nb = $('#qzNext', main); nb.addEventListener('click', next); nb.focus({ preventScroll: true });
    $('#qzAfter', main).scrollIntoView({ block: 'nearest', behavior: smooth() });
  }
  function next() { if (g.i < qs.length - 1) { g.i++; show(); window.scrollTo(0, 0); } else finish(); }
  function finish() {
    alive = false;
    addMinutes(Date.now() - g.start);
    const bonus = g.correct === qs.length ? 20 : 0;
    if (bonus) addXP(bonus);
    commit();
    Voice.say([VL.nOk(g.correct), 'おつかれさま！']);
    showResult({ title: review ? 'ふくしゅう完了！' : 'クイズ終了！', big: g.correct + ' / ' + qs.length, sub: `正解${g.correct}問${bonus ? '<br>全問正解ボーナス +20pt' : ''}`, xp: g.score + bonus, missed: g.missed, noAgain: review && !Object.keys(S.wrong).length });
  }
  const onKey = e => {
    if (e.target && e.target.closest && e.target.closest('input,textarea,select')) return;
    if (/^[1-4]$/.test(e.key) && !g.answered) { const b = $$('.opt', main)[+e.key - 1]; if (b) answer(b); }
    else if (e.key === 'Enter' && g.answered && document.activeElement && document.activeElement.id !== 'qzNext') { const n = $('#qzNext', main); if (n) n.click(); }
  };
  window.addEventListener('keydown', onKey);
  show();
  GAME = { destroy() { window.removeEventListener('keydown', onKey); if (alive) { addMinutes(Date.now() - g.start); commit(); } } };
}

/* ================= ならべかえパズル ================= */
function startOrder(main, subject) {
  const sets = shuffle(ORDER_SETS.filter(o => subject === 'mix' || o.s === subject)).slice(0, 4);
  if (!sets.length) { go('home'); return; }
  bgm('puzzle');
  const g = { i: 0, xp: 0, start: Date.now(), perfect: 0 };
  let cur = null, alive = true, lock = false;
  function setup() {
    const s = sets[g.i];
    let pool = shuffle(s.items.map((t, k) => ({ t, k })));
    if (pool.every((x, k) => x.k === k)) pool = pool.reverse();
    cur = { s, slots: Array(s.items.length).fill(null), pool, miss: 0, done: false, marks: null };
    draw();
    Voice.say(s.t);
  }
  function draw() {
    const s = cur.s, full = cur.slots.every(Boolean);
    main.innerHTML = `<div class="view">
    <div class="q-head"><button class="btn ghost small" data-act="quit">やめる</button><span class="pill">${g.i + 1} / ${sets.length}</span>${subjPill(s.s)}<span class="spacer"></span><span class="pill warn">${g.xp} pt</span></div>
    <div class="q-box"><div class="q">${esc(s.t)}</div><p class="small muted">下のカードを順番にタップ。入れたカードをタップするともどせます。</p></div>
    <div class="slots">${cur.slots.map((p, k) => `<button class="slot ${p ? 'filled' : ''} ${cur.marks && cur.marks[k] ? cur.marks[k] : ''}" data-slot="${k}" ${p && !cur.done ? '' : 'disabled'} aria-label="${k + 1}番目 ${p ? esc(p.t) : '空き'}"><span class="n">${k + 1}</span><span>${p ? esc(p.t) : ''}</span></button>`).join('')}</div>
    ${cur.done ? '' : `<div class="pool">${cur.pool.map((p, k) => `<button class="tile" data-pool="${k}">${esc(p.t)}</button>`).join('')}</div>`}
    <div class="row-btns">${cur.done ? `<div class="explain guide-say" style="flex:1 1 100%">${minatoFace('yatta')}<div><b>せいかい！</b> ${esc(s.e)}</div></div><button class="btn accent" id="odNext">${g.i < sets.length - 1 ? 'つぎのパズルへ' : '結果を見る'}</button>` : `<button class="btn ghost" id="odReset">ぜんぶもどす</button><button class="btn accent" id="odCheck" ${full ? '' : 'disabled'}>こたえあわせ</button>`}</div>
  </div>`;
    $$('[data-pool]', main).forEach(b => b.addEventListener('click', () => {
      if (lock) return;
      const p = cur.pool.splice(+b.dataset.pool, 1)[0];
      const k = cur.slots.indexOf(null); cur.slots[k] = p; cur.marks = null;
      Snd.sfx('tap'); draw();
    }));
    $$('[data-slot]', main).forEach(b => b.addEventListener('click', () => {
      if (lock || cur.done) return;
      const k = +b.dataset.slot; const p = cur.slots[k]; if (!p) return;
      cur.slots[k] = null; cur.pool.push(p); cur.marks = null; Snd.sfx('flip'); draw();
    }));
    const rs = $('#odReset', main); if (rs) rs.addEventListener('click', () => { cur.slots.forEach(p => { if (p) cur.pool.push(p); }); cur.slots.fill(null); cur.marks = null; draw(); });
    const ck = $('#odCheck', main); if (ck) ck.addEventListener('click', check);
    const nx = $('#odNext', main); if (nx) { nx.addEventListener('click', next); nx.focus({ preventScroll: true }); }
  }
  function check() {
    cur.marks = cur.slots.map((p, k) => p && p.k === k ? 'ok' : 'ng');
    if (cur.marks.every(m => m === 'ok')) {
      cur.done = true;
      const pts = Math.max(10, 20 + cur.s.items.length * 5 - cur.miss * 6);
      g.xp += pts; addXP(pts);
      if (!cur.miss) g.perfect++;
      S.counts.puzzle++;
      recordSubj(cur.s.s, cur.miss === 0);
      checkBadges(); commit();
      Snd.sfx('ok'); Voice.say(cur.miss ? 'できた！' : [pickOne(PRAISE), '一発正解！']);
      draw();
    } else {
      cur.miss++; Snd.sfx('ng'); Voice.say('おしい！赤いところを直そう');
      lock = true; draw();
      setTimeout(() => {
        if (!alive) return;
        cur.slots = cur.slots.map((p, k) => { if (p && cur.marks[k] === 'ng') { cur.pool.push(p); return null; } return p; });
        cur.marks = cur.marks.map(m => m === 'ok' ? 'ok' : '');
        lock = false; draw();
      }, 1000);
    }
  }
  function next() {
    if (g.i < sets.length - 1) { g.i++; setup(); window.scrollTo(0, 0); return; }
    alive = false; addMinutes(Date.now() - g.start); commit();
    showResult({ title: 'パズルクリア！', big: sets.length + 'もんクリア', sub: `一発正解 ${g.perfect} 問`, xp: g.xp });
  }
  setup();
  GAME = { destroy() { if (alive) { alive = false; addMinutes(Date.now() - g.start); commit(); } } };
}

/* ================= ペアさがしパズル ================= */
function startPair(main, subject) {
  const sets = shuffle(PAIR_SETS.filter(o => subject === 'mix' || o.s === subject)).slice(0, 2);
  if (!sets.length) { go('home'); return; }
  bgm('puzzle');
  const g = { i: 0, xp: 0, start: Date.now(), misses: 0 };
  let cur = null, alive = true, timers = [];
  function setup() {
    const s = sets[g.i];
    const pairs = shuffle(s.p).slice(0, 6);
    cur = { s, cards: shuffle(pairs.flatMap((p, k) => [{ t: p[0], k }, { t: p[1], k }])), open: [], done: new Set(), miss: 0, lock: false, t0: performance.now() };
    main.innerHTML = `<div class="view">
    <div class="q-head"><button class="btn ghost small" data-act="quit">やめる</button><span class="pill">${g.i + 1} / ${sets.length}</span>${subjPill(s.s)}<span class="spacer"></span><span class="pill">ミス <span id="pmMiss">0</span></span><span class="pill warn">${g.xp} pt</span></div>
    <div class="q-box"><div class="q">${esc(s.t)}</div><p class="small muted">2まいめくって、なかま（ペア）なら開いたまま。ちがったら元にもどります。</p></div>
    <div class="pairs">${cur.cards.map((c, i) => `<button class="pcard" data-c="${i}" aria-label="うらむきのカード ${i + 1}"><span class="in"><span class="f">${HAS_ART ? '' : FUGU_MINI}</span><span class="b">${esc(c.t)}</span></span></button>`).join('')}</div>
    <div id="pmAfter" aria-live="polite"></div>
  </div>`;
    $$('.pcard', main).forEach(b => b.addEventListener('click', () => flip(b)));
    Voice.say([s.t, 'なかまのカードを見つけよう']);
  }
  function flip(b) {
    const i = +b.dataset.c;
    if (cur.lock || cur.done.has(i) || cur.open.includes(i)) return;
    cur.open.push(i); b.classList.add('open'); b.setAttribute('aria-label', cur.cards[i].t); Snd.sfx('flip');
    if (cur.open.length < 2) return;
    const [a, c] = cur.open;
    if (cur.cards[a].k === cur.cards[c].k) {
      cur.done.add(a); cur.done.add(c); cur.open = [];
      [a, c].forEach(j => { const el = $(`.pcard[data-c="${j}"]`, main); el.classList.add('done'); el.disabled = true; });
      Snd.sfx('ok');
      if (cur.done.size === cur.cards.length) clear();
    } else {
      cur.lock = true; cur.miss++; g.misses++;
      $('#pmMiss', main).textContent = cur.miss;
      timers.push(setTimeout(() => {
        if (!alive) return;
        [a, c].forEach(j => { const el = $(`.pcard[data-c="${j}"]`, main); if (el) { el.classList.remove('open'); el.setAttribute('aria-label', 'うらむきのカード ' + (j + 1)); } });
        cur.open = []; cur.lock = false;
      }, 850));
    }
  }
  function clear() {
    const sec = (performance.now() - cur.t0) / 1000;
    const pts = Math.max(20, 60 - cur.miss * 4) + (sec < 45 ? 10 : 0);
    g.xp += pts; addXP(pts);
    S.counts.puzzle++; recordSubj(cur.s.s, cur.miss <= 3);
    checkBadges(); commit();
    Voice.say(cur.miss <= 2 ? 'すごい記憶力！' : 'ぜんぶそろった！');
    $('#pmAfter', main).innerHTML = `<div class="explain stack"><div><b>ぜんぶそろった！</b> ${Math.round(sec)}秒・ミス${cur.miss}回で +${pts}pt${sec < 45 ? '（スピードボーナスつき）' : ''}</div><button class="btn accent" id="pmNext">${g.i < sets.length - 1 ? 'つぎのパズルへ' : '結果を見る'}</button></div>`;
    const n = $('#pmNext', main); n.addEventListener('click', next); n.focus({ preventScroll: true });
  }
  function next() {
    if (g.i < sets.length - 1) { g.i++; setup(); window.scrollTo(0, 0); return; }
    alive = false; addMinutes(Date.now() - g.start); commit();
    showResult({ title: 'パズルクリア！', big: sets.length + 'もんクリア', sub: `ミス合計 ${g.misses} 回`, xp: g.xp });
  }
  setup();
  GAME = { destroy() { timers.forEach(clearTimeout); if (alive) { alive = false; addMinutes(Date.now() - g.start); commit(); } } };
}

/* ================= 適性検査チャレンジ ================= */

function dataBlock(T) {
  if (T.table) {
    const t = T.table;
    return `<div class="scroll-x"><table class="data-table"><caption>${esc(t.cap)}</caption><thead><tr>${t.head.map(h => `<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  if (T.chart) return barChart(T.chart);
  return '';
}
function barChart(c) {
  const COLORS = ['var(--sea)', 'var(--accent)', 'var(--s-eigo)', 'var(--s-rika)', 'var(--s-kokugo)'];
  const single = c.groups.length === 1;
  const cats = single ? c.series.map(s => s[0]) : c.groups;
  const vals = single ? c.series.map(s => [s[1][0]]) : c.groups.map((_, gi) => c.series.map(s => s[1][gi]));
  const max = Math.max(...vals.flat()) * 1.15;
  const W = 520, H = 240, L = 34, R = 8, T = 16, B = 32;
  const cw = (W - L - R) / cats.length;
  const y = v => T + (H - T - B) * (1 - v / max);
  const step = max > 40 ? 20 : max > 20 ? 10 : 5;
  let ticks = ''; for (let v = 0; v <= max; v += step) ticks += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  let bars = '';
  cats.forEach((cat, i) => {
    const n = vals[i].length, bw = Math.min(40, cw * 0.7 / n);
    const x0 = L + cw * i + (cw - bw * n) / 2;
    vals[i].forEach((v, j) => {
      const x = x0 + j * bw;
      bars += `<rect x="${x + 1}" y="${y(v)}" width="${bw - 2}" height="${H - B - y(v)}" rx="3" fill="${single ? COLORS[0] : COLORS[j % COLORS.length]}"/><text x="${x + bw / 2}" y="${y(v) - 4}" text-anchor="middle" font-size="11" fill="var(--ink)">${v}</text>`;
    });
    bars += `<text x="${L + cw * i + cw / 2}" y="${H - B + 18}" text-anchor="middle" font-size="12" fill="var(--ink)">${esc(cat)}</text>`;
  });
  const legend = single ? '' : `<div class="legend">${c.series.map((s, j) => `<span><span class="dot" style="background:${COLORS[j % COLORS.length]}"></span>${esc(s[0])}</span>`).join('')}</div>`;
  return `<div class="stack" style="gap:6px"><div class="small muted"><b>${esc(c.cap)}</b></div><div class="scroll-x"><svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.cap)}">${ticks}${bars}<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--muted)"/></svg></div>${legend}</div>`;
}
function startTekisei(main, id) {
  const T = TEKISEI.find(x => x.id === id);
  if (!T) { go('tekisei'); return; }
  bgm('puzzle');
  const g = { qi: 0, correct: 0, xp: 0, start: Date.now() };
  let alive = true, ctl = null;
  main.innerHTML = `<div class="view">
  <div class="q-head"><button class="btn ghost small" data-act="quit">やめる</button>${T.s.map(subjPill).join('')}<span class="spacer"></span><span class="pill warn" id="tkPts">0 pt</span></div>
  <section class="card stack"><div class="label">適性検査チャレンジ</div><h2 style="font-family:var(--f-display);font-weight:400">${esc(T.t)}</h2><p>${esc(T.intro)}</p>${dataBlock(T)}<div><button class="speak" id="tkRead">${ICON.speak}問題文を読み上げ</button></div></section>
  <section class="card stack" id="tkQ" aria-live="polite"></section>
</div>`;
  $('#tkRead', main).addEventListener('click', () => Voice.say(T.intro, 'ja', true));
  const box = $('#tkQ', main);
  function showQ() {
    const q = T.qs[g.qi]; const opts = shuffle([q.a, ...q.d]);
    box.innerHTML = `<div class="label">問題 ${g.qi + 1} / ${T.qs.length + 1}</div><div class="q" style="font-weight:700;font-size:18px">${esc(q.q)}</div>
    <div class="opts">${opts.map((o, k) => `<button class="opt" data-v="${k}"><span class="k">${k + 1}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="tkAfter"></div>`;
    $$('.opt', box).forEach(b => b.addEventListener('click', () => {
      const ok = opts[+b.dataset.v] === q.a;
      $$('.opt', box).forEach(x => { x.disabled = true; if (opts[+x.dataset.v] === q.a) x.classList.add('ok'); });
      if (!ok) b.classList.add('ng');
      recordSubj(T.s[0], ok);
      if (ok) { g.correct++; g.xp += 20; addXP(20); Snd.sfx('ok'); Voice.say(pickOne(PRAISE)); } else { Snd.sfx('ng'); Voice.say(pickOne(ENCOURAGE)); }
      $('#tkPts', main).textContent = g.xp + ' pt';
      commit();
      $('#tkAfter', box).innerHTML = `<div class="explain stack"><div class="guide-say">${minatoFace(ok ? 'yatta' : 'guide')}<div><b>${ok ? 'せいかい！' : 'こたえ：' + esc(q.a)}</b><br>${esc(q.e)}</div></div><button class="btn accent" id="tkNext">${g.qi < T.qs.length - 1 ? 'つぎの問題へ' : '記述問題へ'}</button></div>`;
      const n = $('#tkNext', box); n.addEventListener('click', () => { g.qi++; if (g.qi < T.qs.length) showQ(); else showW(); box.scrollIntoView({ block: 'start', behavior: smooth() }); });
      n.focus({ preventScroll: true });
    }));
  }
  function showW() {
    const w = T.w;
    const draft = uiGet('tkdraft_' + T.id, '');
    box.innerHTML = `<div class="label">問題 ${T.qs.length + 1} / ${T.qs.length + 1}（記述）</div><div class="q" style="font-weight:700;font-size:18px">${esc(w.q)}</div>
    <div class="flex"><span class="counter" id="twCount">0字</span><span class="small muted">（${w.min}〜${w.max}字）</span></div>
    <textarea class="genko" id="twText" style="min-height:180px" aria-label="答えを書く">${esc(draft)}</textarea>
    <div class="row-btns"><button class="btn accent ai-btn" id="twAI" ${SAMPLE ? '' : 'hidden'}>AI先生に採点してもらう</button><button class="btn ghost" id="twSelf">採点のポイントで自分でチェック</button></div>
    <div id="twFb"></div>`;
    const ta = $('#twText', box), cnt = $('#twCount', box);
    const upd = () => { const n = jlen(ta.value); cnt.textContent = n + '字'; cnt.className = 'counter ' + (n >= w.min && n <= w.max ? 'ok' : n > w.max ? 'ng' : ''); uiSet('tkdraft_' + T.id, ta.value); };
    ta.addEventListener('input', upd); upd();
    $('#twAI', box).addEventListener('click', async () => {
      if (jlen(ta.value) < 10) { toast('もう少し書いてから見てもらおう'); return; }
      ctl = new AbortController();
      const fb = $('#twFb', box);
      fb.innerHTML = `<div class="explain flex"><span>AI先生が読んでいます…</span><span class="spacer"></span><button class="btn ghost small" id="twStop">やめる</button></div>`;
      $('#twStop', box).addEventListener('click', () => ctl && ctl.abort());
      try {
        const r = await aiFeedback({ kind: '適性検査の記述問題の答え', task: T.intro + '\n' + w.q, text: ta.value, min: w.min, max: w.max, keys: w.keys }, ctl.signal);
        if (!alive) return;
        fb.innerHTML = feedbackHTML(r);
        const pts = 10 + Math.round(r.score / 4);
        finishW(pts, r.score);
      } catch (e) { if (alive) fb.innerHTML = aiErrorHTML(e); }
    });
    $('#twSelf', box).addEventListener('click', () => {
      $('#twFb', box).innerHTML = `<div class="explain stack"><b>採点のポイント（できたらチェック）</b>${w.keys.map((k, i) => `<label class="flex"><input type="checkbox" class="twk" id="twk${i}"> ${esc(k)}</label>`).join('')}<label class="flex"><input type="checkbox" class="twk" id="twkLen"> 字数（${w.min}〜${w.max}字）を守った</label><button class="btn accent" id="twDone">チェックして完了</button></div>`;
      $('#twDone', box).addEventListener('click', () => { const n = $$('.twk:checked', box).length; finishW(10 + n * 4, null); });
    });
  }
  function finishW(pts, score) {
    if (!alive) return;
    alive = false;
    g.xp += pts + 20; addXP(pts + 20);
    S.counts.tekisei[T.id] = Math.max(S.counts.tekisei[T.id] || 0, g.correct + 1);
    uiSet('tkdraft_' + T.id, '');
    addMinutes(Date.now() - g.start);
    checkBadges(); commit();
    $('#tkPts', main).textContent = g.xp + ' pt';
    const div = document.createElement('div');
    div.className = 'row-btns';
    div.innerHTML = `<button class="btn accent" id="tkEnd">結果を見る</button>`;
    box.appendChild(div);
    $('#tkEnd', box).addEventListener('click', () => showResult({ title: 'チャレンジクリア！', big: g.correct + ' / ' + T.qs.length, sub: `選択問題 ${g.correct}問正解${score != null ? `・記述 ${score}点` : ''}<br>クリアボーナス +20pt`, xp: g.xp, noAgain: true }));
  }
  showQ();
  GAME = { destroy() { if (ctl) ctl.abort(); if (alive) { alive = false; addMinutes(Date.now() - g.start); commit(); } } };
}

function aiErrorHTML(e) {
  const c = e && e.code;
  let m = 'うまくいきませんでした。少し待ってからもう一度ためしてね。';
  if (c === 'cancelled') m = 'とちゅうでやめました。';
  else if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed') { m = 'AI先生は使えない設定です。「自分でチェック」で練習しよう。'; SAMPLE = null; refreshAI(); }
  else if (c === 'rate_limited') m = 'AI先生が混みあっています。時間をおいてからもう一度ためしてね。';
  else if (c === 'session_expired') m = 'もう一度サインインしてから使ってね。';
  return `<div class="explain">${esc(m)}</div>`;
}
async function aiFeedback(o, signal) {
  if (!SAMPLE) throw { code: 'not_granted' };
  const n = jlen(o.text);
  const prompt = `あなたは公立中高一貫校の適性検査（作文・記述・面接）を指導しているベテランの先生です。小学6年生の${o.kind}を読んで、やさしく具体的にアドバイスしてください。

【課題】${o.task}
【字数の条件】${o.min ? o.min + '〜' + o.max + '字' : 'なし'}（実際は${n}字）
${o.keys ? '【採点のポイント】' + o.keys.join('／') + '\n' : ''}【子どもの答え】
${o.text.slice(0, 2000)}

観点：課題に正面から答えているか、理由や体験が具体的か、構成（はじめ・中・終わり）、字数、言葉づかい。
小学生にわかるやさしい言葉で書くこと。次のJSONだけで答えること。
{"score": 0から100の整数, "good": ["よかった点", "よかった点"], "improve": ["もっとよくなる点", "もっとよくなる点"], "example": "書き直しの例を1〜2文", "comment": "はげましの一言"}`;
  const r = await SAMPLE.json(prompt, { modelTier: 'default', signal });
  const arr = v => Array.isArray(v) ? v.filter(x => typeof x === 'string').slice(0, 3) : [];
  return {
    score: clamp(Math.round(Number(r && r.score) || 0), 0, 100),
    good: arr(r && r.good), improve: arr(r && r.improve),
    example: r && typeof r.example === 'string' ? r.example : '',
    comment: r && typeof r.comment === 'string' ? r.comment : '',
  };
}

function subjFromLabel(l) {

}
const GPT_PROMPT = `小学6年生の公立中高一貫校（適性検査型）の受検対策として、［教科名］の4択問題を10問作ってください。
1行に1問、次の形式だけで出力してください（区切りは半角の縦線 | ）。
教科|問題|正解|まちがい1|まちがい2|まちがい3|解説

function newId() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function parseImport(text) {
  const ok = [], bad = [];
  text.split(/\r?\n/).forEach((line, i) => {
    const l = line.trim(); if (!l) return;
    const p = l.split(/[|｜\t]/).map(x => x.trim());
    const s = subjFromLabel(p[0]);
    if (p.length < 5 || !s || !p[1] || !p[2]) { bad.push(i + 1); return; }
    const d = p.slice(3, Math.min(6, p.length)).filter(x => x && x !== p[2]);
    const e = p.length >= 7 ? p.slice(6).join(' ') : '';
    if (d.length < 2) { bad.push(i + 1); return; }
    ok.push({ id: newId() + i, s, lv: 2, q: p[1].slice(0, 200), a: p[2].slice(0, 40), d: d.map(x => x.slice(0, 40)), e: e.slice(0, 200) });
  });
  return { ok, bad };
}

async function aiGenerate(subj, lv, n) {
  if (!SAMPLE) throw { code: 'not_granted' };
  const p = `小学6年生向けに、公立中高一貫校（適性検査型）の受検対策として「${SUBJ[subj].n}」の4択問題を${n}問作ってください。
むずかしさ：${lv === 1 ? '基本' : lv === 2 ? '標準' : '小6の少し上（中1の入り口）'}
条件：
- 正解は1つだけ。事実として確かな内容にする（自信のないものは出さない）。
- 正解とまちがいの選択肢は短く（できれば9文字以内）。
- 歌詞・詩・本の文章の引用はしない。
- 解説は1〜2文、小学生にわかる言葉で。
次の形のJSON配列だけで答えること：
[{"q":"問題文","a":"正解","d":["まちがい1","まちがい2","まちがい3"],"e":"解説"}]`;
  const r = await SAMPLE.json(p, { modelTier: 'default', cache: false });
  if (!Array.isArray(r)) throw { code: 'invalid_json' };
  return r.filter(x => x && typeof x.q === 'string' && typeof x.a === 'string' && Array.isArray(x.d))
    .map(x => ({ q: x.q.slice(0, 200), a: x.a.slice(0, 40), d: x.d.filter(v => typeof v === 'string' && v && v !== x.a).slice(0, 3).map(v => v.slice(0, 40)), e: typeof x.e === 'string' ? x.e.slice(0, 200) : '' }))
    .filter(x => x.d.length >= 2).slice(0, n);
}

/* ================= 独立アプリ（PWA）用 ================= */
function downloadFile(name, text, type) {
  try {
    const url = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('ファイルを作りました：' + name);
  } catch (e) { toast('ファイルを作れませんでした'); }
}
function makeIcs() {
  const [h, m] = (S.settings.remindTime || '19:00').split(':').map(Number);
  const d = new Date(); if (d.getHours() * 60 + d.getMinutes() >= h * 60 + m) d.setDate(d.getDate() + 1);
  const ymd = x => x.getFullYear() + pad(x.getMonth() + 1) + pad(x.getDate());
  const end = new Date(d); end.setHours(h, m + 15, 0, 0);
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const name = S.settings.name ? S.settings.name + 'さん、' : '';
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//tenka-daiichi//JA', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    'UID:tenka-daiichi-daily-reminder', 'DTSTAMP:' + stamp,
    'DTSTART:' + ymd(d) + 'T' + pad(h) + pad(m) + '00', 'DTEND:' + ymd(end) + 'T' + pad(end.getHours()) + pad(end.getMinutes()) + '00',
    'RRULE:FREQ=DAILY', 'SUMMARY:めざせ天下第一関で勉強しよう',
    'DESCRIPTION:' + name + '今日の目標は' + S.settings.goal + 'ポイント。ふくぞうと勉強しよう！',
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:めざせ天下第一関で勉強しよう', 'TRIGGER:PT0M', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n') + '\r\n';
}
function todayReport() {
  const t = S.days[dkey()] || { xp: 0, c: 0, a: 0, min: 0 };
  const d = new Date(), w = '日月火水木金土'[d.getDay()];
  const name = S.settings.name || '';
  return `【めざせ天下第一関】${d.getMonth() + 1}/${d.getDate()}(${w}) ${name ? name + 'の' : ''}学習記録\n今日：${t.xp}pt（目標${S.settings.goal}pt）・${Math.round(t.min || 0)}分・${t.a}問中${t.c}問正解\nれんぞく学習：${streak()}日／合計：${S.xp}pt（${rankOf(S.xp).name}）`;
}
async function shareToday() {
  const text = todayReport();
  try {
    if (navigator.share) { await navigator.share({ title: 'めざせ天下第一関', text }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('記録をコピーしました。LINEなどにはりつけて送ってください'); }
  catch (e) { modal(`<b>この文をコピーして送ってください</b><div class="code">${esc(text)}</div><div class="row-btns"><button class="btn accent" data-act="close">とじる</button></div>`); }
}

/* ---------- ホーム画面に入れる（インストール）案内 ---------- */
let deferredInstall = null;
function isInstalled() { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } }
function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function inAppBrowser() { return /Line\/|FBAN|FBAV|Instagram/i.test(navigator.userAgent); }
function installCardHTML() {
  if (!STANDALONE || isInstalled() || uiGet('installHide', 0) > Date.now()) return '';
  return `<section class="install-card" aria-label="ホーム画面に入れる">${minatoImg('guide', 'inst-guide')}<div class="stack" style="gap:6px"><b>このアプリを ホーム画面に入れよう！</b><span class="small">アイコンからすぐ開けて、インターネットがなくても遊べるよ。</span><div class="row-btns"><button class="btn accent small" data-act="install">入れかたを見る</button><button class="btn ghost small" data-act="installHide">あとで</button></div></div></section>`;
}
const SHARE_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11v9h12v-9"/></svg>';
function showInstall() {
  if (deferredInstall) {
    const p = deferredInstall; deferredInstall = null;
    p.prompt(); p.userChoice.then(r => { if (r && r.outcome === 'accepted') toast('ホーム画面に入ったよ！'); render(); }).catch(() => {});
    return;
  }
  const ios = isIOS();
  const steps = inAppBrowser()
    ? `<p>いまはLINEなどのアプリの中で開いているので、ここからは入れられないよ。</p><ol class="steps"><li>画面の右上（または下）の <b>メニュー</b> をタップ</li><li><b>「ブラウザで開く」</b>（iPhone・iPadは「Safariで開く」）をえらぶ</li><li>開いたページで、もう一度この「入れかたを見る」をおしてね</li></ol>`
    : ios
      ? `<ol class="steps"><li><b>Safari</b> で開いていることを確かめる</li><li>共有ボタン ${SHARE_ICON} をタップ（iPhoneは画面の下、iPadは右上）</li><li>メニューを下に動かして <b>「ホーム画面に追加」</b> をタップ</li><li>右上の <b>「追加」</b> をタップ。ふくぞうのアイコンができたら完成！</li></ol>`
      : `<ol class="steps"><li>ブラウザ（Chrome・Edge）の右上の <b>メニュー（︙）</b> をタップ</li><li><b>「アプリをインストール」</b> または <b>「ホーム画面に追加」</b> をタップ</li><li><b>「インストール」</b> をタップ。ふくぞうのアイコンができたら完成！</li></ol>`;
  modal(`<div class="center">${minatoImg('guide', 'result-guide')}</div>
  <h2 class="center" style="font-family:var(--f-display);font-weight:400;font-size:22px">ホーム画面に入れよう</h2>
  ${steps}
  <p class="small muted">入れたあとは、いつもホーム画面の「天下第一関」アイコンから開いてね。記録はアイコンのアプリの中に残るよ。</p>
  <div class="row-btns"><button class="btn accent" data-act="close">わかった</button></div>`);
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('ホーム画面に入ったよ！次からはアイコンから開いてね'); if (VIEW === 'home' && !inGame()) render(); });

/* ---------- はじめてのあいさつ（案内人みなと） ---------- */
function showIntro() {
  const msg = VL.intro;
  modal(`<div class="intro"><div class="center">${minatoImg('guide', 'intro-guide')}</div>
  <h2 class="center" style="font-family:var(--f-display);font-weight:400;font-size:22px">案内人のみなとです</h2>
  <p>${esc(msg)}</p>
  <ul class="intro-list"><li>ゲームで正解すると <b>ポイント</b> がたまって、ランクが上がるよ</li><li>まちがえた問題は <b>ふくしゅう</b> にとっておくから、あとでとき直そう</li><li>1日の目標は <b>${S.settings.goal}ポイント</b>。毎日つづけると、れんぞく記録がのびるよ</li></ul>
  <div class="row-btns"><button class="btn ghost" data-act="introVoice">${ICON.speak} みなとの声を聞く</button><button class="btn accent" data-act="introStart">はじめる</button></div></div>`);
  setTimeout(() => Voice.say(msg), 300);
}

/* ================= 勉強していないときのお知らせ ================= */
function endOfToday() { const d = new Date(); d.setHours(23, 59, 59, 999); return d.getTime(); }
function checkReminder(force) {
  const s = S.settings;
  const t = S.days[dkey()], xp = t ? t.xp : 0;
  if (!force) {
    if (!s.remindOn || inGame() || $('#banner') || $('#modal')) return;
    const [h, m] = (s.remindTime || '19:00').split(':').map(Number);
    const now = new Date();
    if (now.getHours() * 60 + now.getMinutes() < h * 60 + m) return;
    if (xp >= s.goal) return;
    if (Date.now() < uiGet('remindNext', 0)) return;
  }
  const old = $('#banner'); if (old) old.remove();
  const name = s.name ? s.name + 'さん' : '';
  const msg = xp === 0 ? `${name ? name + '、' : ''}今日はまだ勉強していないよ！10分だけいっしょにやろう。` : xp >= s.goal ? '今日の目標は達成しているよ！（これはお知らせのテストです）' : `今日の目標まで、あと ${s.goal - xp} ポイント！もうひとがんばり！`;
  const b = document.createElement('div');
  b.className = 'banner'; b.id = 'banner'; b.setAttribute('role', 'alert');
  b.innerHTML = `<div class="in">${minatoFace('ganbare', 'banner-guide')}<div><b>みなとからのお知らせ</b><br>${esc(msg)}</div><div class="row-btns"><button class="btn small" data-act="bannerGo" style="background:var(--ink);color:var(--bg)">いますぐやる</button><button class="btn small ghost" data-act="bannerLater">30分後</button><button class="btn small ghost" data-act="bannerClose">とじる</button></div></div>`;
  document.body.appendChild(b);
  uiSet('remindNext', endOfToday());
  Snd.sfx('chime');
  setTimeout(() => Voice.say(VL.remind(xp, s.goal)), 700); // 名前や数字は画面に出し、声は録音したセリフで
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification('めざせ天下第一関', { body: msg }); } catch (e) { /* 通知が使えない環境 */ }
}

/* ================= 操作 ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act;
  switch (a) {
    case 'nav': closeModal(); go(el.dataset.view); break;
    case 'select': go('select', { mode: el.dataset.mode }); break;
    case 'pick':
      $$('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === el)));
      $('#startBtn').dataset.subject = el.dataset.subject;
      uiSet('subj_' + PARAMS.mode, el.dataset.subject); Snd.sfx('tap');
      break;
    case 'start': uiSet('subj_' + el.dataset.mode, el.dataset.subject); go('play', { mode: el.dataset.mode, subject: el.dataset.subject }); break;
    case 'review': go('play', { mode: 'quiz', subject: 'mix', review: true }); break;
    case 'quit': go(quitTarget()); break;
    case 'home': closeModal(); go('home'); break;
    case 'again': closeModal(); go('play', { ...PARAMS }); break;
    case 'tk': go('play', { mode: 'tekisei', id: el.dataset.id }); break;
    case 'essay': go('play', { mode: 'essay', id: el.dataset.id }); break;
    case 'iv': go('play', { mode: 'interview', idx: Number(el.dataset.idx) || 0 }); break;
    case 'bannerGo': { const b = $('#banner'); if (b) b.remove(); closeModal(); go('play', { mode: 'shooter', subject: weakest() }); break; }
    case 'bannerLater': { const b = $('#banner'); if (b) b.remove(); uiSet('remindNext', Date.now() + 30 * 60000); toast('30分後にまたお知らせするね'); break; }
    case 'close': closeModal(); break;
    case 'introStart': uiSet('introSeen', 1); Voice.stop(); closeModal(); Snd.sfx('badge'); break;
    case 'introVoice': Voice.say(VL.intro, 'ja', true); break;
    case 'install': showInstall(); break;
    case 'installHide': uiSet('installHide', Date.now() + 3 * 864e5); render(); break;
    case 'shareToday': shareToday(); break;
    case 'bannerClose': { const b = $('#banner'); if (b) b.remove(); uiSet('remindNext', endOfToday()); break; }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal')) closeModal(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Snd.stop(); Voice.stop(); }
  else if (S.settings.bgm && Snd.want && Snd.ready) Snd.play(Snd.want);
});
const unlockAudio = () => { Snd.unlock(); Voice.unlock(); if (S.settings.bgm && Snd.want) Snd.play(Snd.want); };
// iPhone・iPad はタッチを離したとき（touchend / click）でないと音を出す許可が出ないので、いくつかの合図で試す
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
$('#btnBgm').addEventListener('click', () => {
  S.settings.bgm = !S.settings.bgm; commit(); updateTop();
  if (S.settings.bgm) { if (Snd.want) Snd.play(Snd.want); toast('BGMをオンにしました'); } else { Snd.stop(); toast('BGMをオフにしました'); }
});
$('#btnVoice').addEventListener('click', () => {
  S.settings.voice = !S.settings.voice; commit(); updateTop();
  if (!S.settings.voice) { Voice.stop(); toast('音声をオフにしました'); return; }
  Voice.say('読み上げをオンにしたよ');
});

/* ================= 起動 ================= */
function boot() {
  $('#logoArt').innerHTML = fukuImg('hi', 'logo-fuku');
  if (HAS_ART) {
    const r = document.documentElement.style;
    r.setProperty('--art-day', `url("${ART.strait_day}")`);
    r.setProperty('--art-night', `url("${ART.sea_night}")`);
    r.setProperty('--art-fuku', `url("${ART.fuku_hi}")`);
  }
  $('#btnBgm').innerHTML = ICON.music;
  $('#btnVoice').innerHTML = ICON.voice;
  $$('[data-icon]').forEach(x => { x.innerHTML = ICON[x.dataset.icon] || ''; });
  Voice.init();
  if (/[?&]debug=1\b/.test(location.search)) window.__tenka = { Voice, S }; // テスト用
  if (STANDALONE && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render();
  initCapabilities();
  // 画面を閉じる・アプリを切りかえるときは、待たずにクラウドへ書く
  const flushNow = () => { if (isDirty()) flush(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushNow(); });
  window.addEventListener('pagehide', flushNow);
  checkBadges();
  setTimeout(() => checkReminder(false), 4000);
  if (!uiGet('introSeen', 0) && !S.xp) setTimeout(() => { if (!$('#modal') && VIEW === 'home') showIntro(); }, 600);
  setInterval(() => checkReminder(false), 60000);
}
boot();

})();
</script>

<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  var hadController = !!navigator.serviceWorker.controller;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController) { hadController = true; return; }
    var t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', 'status');
    t.innerHTML = '新しいバージョンになりました <button class="btn small accent" style="margin-left:8px">開き直す</button>';
    t.querySelector('button').onclick = function () { location.reload(); };
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 15000);
  });
})();
</script>
