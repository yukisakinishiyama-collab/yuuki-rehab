# 予約投稿ジョブ・自動投稿パイプラインの自動実行（15分間隔）
#
# - 期限のきた投稿ジョブを実行（承認済みの投稿だけ）
# - 自動投稿パイプライン: 日曜夕方に翌週分のAI下書きを作成→院長へLINE通知、
#   承認されないまま時刻が過ぎた案を期限切れに、前日リマインド（ほとんどの回は一瞬で終わる）
#
# Vercel無料プランのCronは1日1回のため、GitHub Actionsで補強する。
# リポジトリの Settings → Secrets and variables → Actions に
# MARKETING_CRON_SECRET（Vercelの CRON_SECRET と同じ値）を登録すると有効になる。
name: marketing-publish-jobs

on:
  schedule:
    - cron: '*/15 * * * *' # UTC基準・15分ごと
  workflow_dispatch: # 手動実行も可能
    inputs:
      generate_now:
        description: '自動投稿の案を今すぐ作る（今週の残り枠、なければ来週の分）'
        type: boolean
        default: false

jobs:
  run-due-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 期限のきた投稿ジョブを実行
        run: |
          curl -fsS -X POST "https://yuuki-rehab.vercel.app/api/marketing/jobs/run" \
            -H "Authorization: Bearer ${{ secrets.MARKETING_CRON_SECRET }}" \
            -H "Content-Type: application/json"

      - name: 自動投稿パイプライン（下書き作成・期限切れ整理・リマインド）
        if: always()
        run: |
          URL="https://yuuki-rehab.vercel.app/api/marketing/autopilot/run"
          if [ "${{ inputs.generate_now }}" = "true" ]; then URL="$URL?generate=now"; fi
          curl -sS --max-time 290 -w "\nHTTP %{http_code}\n" -X POST "$URL" \
            -H "Authorization: Bearer ${{ secrets.MARKETING_CRON_SECRET }}" \
            -H "Content-Type: application/json"
